name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is the point of this matrix: dc.cmd and the PATH-registration path
    # cannot be exercised on Linux, so they are only ever covered here.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Unit tests
        run: node --test

      - name: Shim runs (bash)
        if: runner.os != 'Windows'
        run: |
          ./.devcontainer/dc version
          ./.devcontainer/dc help > /dev/null

      - name: Shim runs (cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          .\.devcontainer\dc.cmd version
          .\.devcontainer\dc.cmd help > NUL

      - name: Shim runs (powershell, via PATHEXT)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$PWD\.devcontainer;$env:PATH"
          # Bare `dc` must resolve to dc.cmd through PATHEXT — the assumption the
          # single-Windows-file design rests on.
          if ((Get-Command dc).Source -notlike '*dc.cmd') { throw "resolved to $((Get-Command dc).Source)" }
          dc version

      - name: Argument fidelity through the cmd shim
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # cmd.exe re-parses the command line before node sees it -- the one layer
          # that cannot be tested from Linux. Exercise it with a standalone shim of
          # the same shape, so this checks argument passing rather than dc's Docker
          # preflight (these runners have no usable Linux-container support).
          $dir = Join-Path $env:RUNNER_TEMP 'shimtest'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          'console.log(JSON.stringify(process.argv.slice(2)))' | Set-Content "$dir\args.mjs"
          '@node "%~dp0args.mjs" %*' | Set-Content "$dir\shim.cmd"

          $got  = (& "$dir\shim.cmd" 'a b' 'a&b' 'C:\Users\x' '--flag').Trim()
          $want = '["a b","a&b","C:\\Users\\x","--flag"]'
          Write-Host "got:  $got"
          Write-Host "want: $want"
          if ($got -ne $want) { throw "cmd.exe mangled arguments through the shim" }

          # Informational: embedded quotes are the known-fragile case through cmd.
          # Recorded rather than asserted -- if this ever comes back wrong, that is
          # the signal to add a dc.ps1 alongside dc.cmd.
          $q = (& "$dir\shim.cmd" 'say "hi"' '').Trim()
          Write-Host "embedded quotes / empty arg: $q"

      - name: Install / uninstall round-trip
        run: |
          node ./.devcontainer/dc.mjs install dctest
          node ./.devcontainer/dc.mjs uninstall dctest
